<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a515a">
  <title>Service client | JEEP</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #eceef2;
      --text: #20252b;
      --muted: #8b929b;
      --border: #e8eaed;
      --dark: #303741;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--text);
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      height: 100vh;
      height: 100dvh;
      max-width: 650px;
      margin: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      padding-top: max(12px, env(safe-area-inset-top));
      color: #fff;
      background: linear-gradient(165deg, #4d555f 0%, #2e353e 100%);
      box-shadow: 0 4px 16px rgba(27,39,51,.18);
      z-index: 2;
    }

    .back {
      width: 40px;
      height: 40px;
      border: 0;
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .avatar {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.18);
      color: white;
      font-size: 18px;
      font-weight: 800;
    }

    .online-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      bottom: 0;
      right: 0;
      border: 2px solid #3a424c;
      border-radius: 50%;
      background: #26b56c;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      font-size: 16px;
      margin: 0 0 4px;
      font-weight: 800;
    }

    .header-info p {
      font-size: 11px;
      color: rgba(255,255,255,.78);
      margin: 0;
    }

    .header-info p::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #26b56c;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .more {
      width: 40px;
      height: 40px;
      border: 0;
      background: rgba(255,255,255,.16);
      border-radius: 50%;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      overscroll-behavior: contain;
    }

    .welcome {
      align-self: center;
      max-width: 90%;
      padding: 9px 14px;
      margin: 0 0 10px;
      border-radius: 14px;
      text-align: center;
      background: #dfe3e9;
      color: #566170;
      font-size: 11px;
      line-height: 1.6;
    }

    .day {
      align-self: center;
      font-size: 10px;
      color: #818994;
      background: #dfe3e9;
      padding: 6px 10px;
      border-radius: 20px;
      margin: 3px 0;
    }

    .message-row {
      display: flex;
      width: 100%;
      align-items: flex-end;
      gap: 7px;
    }

    .message-row.mine { justify-content: flex-end; }
    .message-row.theirs { justify-content: flex-start; }

    .mini-avatar {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(160deg, #4b535d 0%, #323a44 100%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .bubble {
      max-width: 80%;
      min-width: 60px;
      padding: 11px 14px 8px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      box-shadow: 0 3px 10px rgba(27,39,51,.06);
    }

    .mine .bubble {
      background: linear-gradient(160deg, #4b535d 0%, #323a44 100%);
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .theirs .bubble {
      background: white;
      color: #252b32;
      border-bottom-left-radius: 6px;
    }

    .message-time {
      margin-top: 5px;
      text-align: right;
      color: #858e98;
      font-size: 10px;
    }

    .mine .message-time { color: rgba(255,255,255,.62); }

    .state {
      padding: 14px;
      text-align: center;
      color: #8b929b;
      font-size: 12px;
      line-height: 1.6;
    }

    .retry {
      border: 0;
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      margin-top: 10px;
      font-weight: 800;
      background: linear-gradient(180deg, #4d5560 0%, #353d47 100%);
      box-shadow: 0 6px 14px rgba(30,38,48,.22);
    }

    .composer-wrap {
      flex-shrink: 0;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      padding: 5px 5px 5px 16px;
      border: 1px solid #e0e4e8;
      border-radius: 28px;
      background: #f1f3f6;
    }

    .composer:focus-within {
      border-color: #596674;
      box-shadow: 0 0 0 3px rgba(89,102,116,.15);
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      max-height: 120px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      padding: 11px 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #9aa1aa; }

    .send {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #4d5560 0%, #353d47 100%);
      box-shadow: 0 6px 14px rgba(30,38,48,.22);
      color: white;
    }

    .send svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send:disabled {
      opacity: .45;
      box-shadow: none;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      font-size: 10px;
      color: #9aa1aa;
      margin: 8px 0 0;
    }

    @media (min-width: 651px) {
      body { padding: 15px 0; }
      .app {
        height: calc(100vh - 30px);
        height: calc(100dvh - 30px);
        border-radius: 24px;
        box-shadow: 0 5px 30px rgba(0,0,0,.08);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <button class="back" id="backBtn" type="button" aria-label="Retour">‹</button>

      <div class="avatar">
        J
        <span class="online-dot"></span>
      </div>

      <div class="header-info">
        <h1>Service client JEEP</h1>
        <p id="connectionStatus">Messagerie d'assistance</p>
      </div>

      <button class="more" id="refreshBtn" type="button" aria-label="Actualiser">↻</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="welcome">
        Bienvenue dans l'assistance JEEP.<br>
        Écrivez votre message ci-dessous pour commencer la conversation.
      </div>
      <div class="state">Chargement de la conversation…</div>
    </main>

    <footer class="composer-wrap">
      <form id="messageForm" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="5000"
          placeholder="Écrire un message…"
          aria-label="Votre message"
          required
        ></textarea>
        <button id="sendBtn" class="send" type="submit" aria-label="Envoyer" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 2 11 13"/>
            <path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
          </svg>
        </button>
      </form>
      <p class="hint">Service client JEEP · Ne partagez jamais votre mot de passe ou code OTP.</p>
    </footer>
  </div>

  <script>
    "use strict";

    const API_URL =
      "https://nayyovsuollsdvxtslmb.supabase.co/functions/v1/jeep-api";

    const $ = id => document.getElementById(id);

    let conversation = null;
    let messages = [];
    let sending = false;
    let refreshing = false;
    let refreshTimer = null;

    const input = $("messageInput");
    const chat = $("chat");

    function getToken() {
      return sessionStorage.getItem("jeep_session_token");
    }

    function clearSession() {
      [
        "jeep_session_token",
        "jeep_user_id",
        "jeep_user_country",
        "jeep_user_role"
      ].forEach(key => sessionStorage.removeItem(key));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);
    }

    function formatTime(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function showState(message, withRetry = false) {
      chat.innerHTML = `
        <div class="welcome">
          Bienvenue dans l'assistance JEEP.<br>
          Écrivez votre message ci-dessous pour commencer la conversation.
        </div>
        <div class="state">
          ${escapeHtml(message)}
          ${withRetry ? '<br><button id="retryBtn" class="retry" type="button">Réessayer</button>' : ""}
        </div>`;

      $("retryBtn")?.addEventListener("click", startChat);
    }

    async function api(action, extra = {}) {
      const session = getToken();

      if (!session) {
        clearSession();
        location.replace("/connexion");
        throw new Error("SESSION_REQUIRED");
      }

      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + session
          },
          body: JSON.stringify({ action, ...extra })
        });
      } catch (_) {
        throw new Error("NETWORK_ERROR");
      }

      let data;
      try {
        data = await response.json();
      } catch (_) {
        throw new Error("SERVER_RESPONSE_INVALID");
      }

      if (response.status === 401 ||
          ["INVALID_SESSION", "SESSION_EXPIRED"].includes(data.error)) {
        clearSession();
        location.replace("/connexion");
        throw new Error("SESSION_REQUIRED");
      }

      if (!response.ok || data.error || data.ok === false) {
        throw new Error(data.error || "REQUEST_FAILED");
      }

      return data;
    }

    function messageError(code) {
      const errors = {
        NETWORK_ERROR: "Connexion Internet impossible.",
        SESSION_REQUIRED: "Votre session a expiré. Reconnectez-vous.",
        CONVERSATION_NOT_FOUND: "La conversation est introuvable.",
        SUPPORT_UNAVAILABLE: "Impossible de charger la conversation.",
        SUPPORT_MESSAGES_UNAVAILABLE: "Impossible de charger les messages.",
        SUPPORT_CREATE_FAILED: "Impossible de démarrer la conversation.",
        SUPPORT_MESSAGE_FAILED: "Le message n'a pas pu être enregistré.",
        CONVERSATION_CLOSED: "Cette conversation est fermée.",
        INVALID_MESSAGE: "Le message est vide ou trop long."
      };
      return errors[code] || "Une erreur est survenue. Réessayez.";
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chat.scrollTop = chat.scrollHeight;
      });
    }

    function renderMessages() {
      const welcome = `
        <div class="welcome">
          Bienvenue dans l'assistance JEEP.<br>
          Écrivez votre message ci-dessous pour commencer la conversation.
        </div>`;

      if (!messages.length) {
        chat.innerHTML = welcome + `
          <div class="state">
            Aucun message pour le moment.<br>
            Envoyez un message pour démarrer votre conversation.
          </div>`;
        return;
      }

      chat.innerHTML = welcome + messages.map(message => {
        const mine = String(message.sender_role).toLowerCase() !== "admin";
        return `
          <div class="message-row ${mine ? "mine" : "theirs"}">
            ${mine ? "" : '<div class="mini-avatar">J</div>'}
            <div class="bubble">
              ${escapeHtml(message.message)}
              <div class="message-time">${escapeHtml(formatTime(message.created_at))}</div>
            </div>
          </div>`;
      }).join("");

      scrollToBottom();
    }

    async function findOrCreateConversation() {
      const data = await api("support_conversations");
      const list = Array.isArray(data.conversations) ? data.conversations : [];

      // Reprendre une conversation ouverte si elle existe déjà.
      const existing = list.find(item =>
        String(item.status).toLowerCase() !== "closed"
      );

      if (existing) return existing;

      // Créer une conversation uniquement lorsque l'utilisateur commence
      // réellement à envoyer son premier message.
      return null;
    }

    async function startChat() {
      if (refreshing) return;
      refreshing = true;
      $("connectionStatus").textContent = "Chargement…";

      try {
        conversation = await findOrCreateConversation();

        if (conversation) {
          await loadMessages(false);
        } else {
          messages = [];
          renderMessages();
        }

        $("connectionStatus").textContent =
          conversation ? "Conversation avec l'équipe JEEP" : "Écrivez-nous directement";
        updateComposer();
      } catch (error) {
        showState(messageError(error.message), true);
        $("connectionStatus").textContent = "Connexion à l'assistance";
      } finally {
        refreshing = false;
      }
    }

    async function loadMessages(quiet = true) {
      // Pas de blocage sur "refreshing" : startChat l'appelle
      // pendant son propre chargement.
      if (!conversation) return;

      const oldHeight = chat.scrollHeight;
      const oldTop = chat.scrollTop;
      const wasNearBottom =
        oldHeight - oldTop - chat.clientHeight < 100;

      try {
        const data = await api("support_messages", {
          conversation_id: conversation.id
        });

        const fresh = Array.isArray(data.messages) ? data.messages : [];
        const previousLast = messages.length
          ? messages[messages.length - 1].id : null;
        const freshLast = fresh.length
          ? fresh[fresh.length - 1].id : null;

        messages = fresh;
        renderMessages();

        if (!wasNearBottom && previousLast === freshLast) {
          chat.scrollTop = oldTop;
        }

        $("connectionStatus").textContent = "Conversation avec l'équipe JEEP";
      } catch (error) {
        if (!quiet) showState(messageError(error.message), true);
      }
    }

    function updateComposer() {
      const closed = conversation &&
        String(conversation.status).toLowerCase() === "closed";

      input.disabled = Boolean(closed);
      $("sendBtn").disabled =
        Boolean(closed) || sending || !input.value.trim();

      if (closed) {
        input.placeholder = "Cette conversation est fermée";
      } else {
        input.placeholder = "Écrire un message…";
      }
    }

    async function sendMessage(text) {
      if (sending || !text.trim()) return;

      sending = true;
      input.value = "";
      input.style.height = "auto";
      updateComposer();

      try {
        if (!conversation) {
          const data = await api("support_create", {
            subject: "Assistance JEEP",
            message: text.trim()
          });

          conversation = data.conversation;
          if (!conversation || !conversation.id) {
            throw new Error("SUPPORT_CREATE_FAILED");
          }

          // Le premier message a déjà été enregistré par support_create.
          messages = [];
          await loadMessages(false);
        } else {
          await api("support_send", {
            conversation_id: conversation.id,
            message: text.trim()
          });

          await loadMessages(false);
        }
      } catch (error) {
        alert(messageError(error.message));
        if (conversation) await loadMessages(false);
      } finally {
        sending = false;
        updateComposer();
        input.focus();
      }
    }

    $("messageForm").addEventListener("submit", async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      await sendMessage(text);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
      updateComposer();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        $("messageForm").requestSubmit();
      }
    });

    $("refreshBtn").addEventListener("click", async () => {
      if (conversation) await loadMessages(false);
      else await startChat();
    });

    $("backBtn").addEventListener("click", () => {
      location.href = "/moi";
    });

    if (!getToken()) {
      clearSession();
      location.replace("/connexion");
    } else {
      startChat();

      // Actualise les réponses quand la page reste ouverte.
      refreshTimer = setInterval(() => {
        if (!document.hidden && conversation && !sending) {
          loadMessages(true);
        }
      }, 5000);
    }

    window.addEventListener("pagehide", () => {
      if (refreshTimer) clearInterval(refreshTimer);
    });
  </script>
</body>
</html>
