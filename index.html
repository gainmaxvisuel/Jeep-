<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Oscar — Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <img
        class="logo"
        src="logo.png"
        alt="Oscar"
      >

      <form id="signup-form">
        <label for="phone">Numéro de téléphone</label>
        <div class="phone-field">
          <span>+226</span>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel-national"
            pattern="[0-9]{8}"
            maxlength="8"
            placeholder="00 00 00 00"
            required
          >
        </div>

        <label for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        >

        <label for="password-confirmation">Confirmer le mot de passe</label>
        <input
          id="password-confirmation"
          name="password_confirmation"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        >

        <label for="referral">Code de parrainage (facultatif)</label>
        <input
          id="referral"
          name="referral_code"
          type="text"
          maxlength="6"
          autocomplete="off"
        >

        <button type="submit">S'inscrire</button>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
