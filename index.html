<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f3640">
  <title>Créer un compte | JEEP</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#1f2937;
      background:linear-gradient(180deg,#4a525c 0%,#2f3640 30%,#505a66 58%,#b9bec6 78%,#eff0f4 100%);
      background-attachment:fixed;display:flex;justify-content:center;padding:0 22px 30px}
    .container{width:100%;max-width:420px}
    .brand{text-align:center;padding:48px 0 40px}
    .brand img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto;
      border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
    .field{display:flex;align-items:center;gap:12px;background:#fff;
      border:1px solid #d5d9e0;border-radius:8px;padding:0 16px;margin-bottom:14px;height:56px}
    .field svg{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:#374151;
      stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .field input{flex:1;min-width:0;border:0;outline:0;background:transparent;
      font-size:16px;color:#111827;height:100%}
    .field input::placeholder{color:#9ca3af}
    .field:focus-within{border-color:#4b5563;box-shadow:0 0 0 2px rgba(75,85,99,.25)}
    button{width:100%;border:0;border-radius:40px;height:58px;margin-top:10px;
      background:linear-gradient(180deg,#4b5563,#2f3640);color:#fff;
      font-size:20px;font-weight:700;cursor:pointer;
      box-shadow:0 10px 22px rgba(0,0,0,.25)}
    button:disabled{opacity:.6;cursor:wait}
    .message{display:none;padding:12px;border-radius:10px;margin:4px 0 12px;
      font-size:13px;line-height:1.5}
    .error{display:block;background:#48262b;color:#ffd9dd}
    .bottom{text-align:center;margin-top:28px}
    .bottom a{color:#1f2937;font-size:17px;text-decoration:underline}
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <img src="/logo.jpg" alt="JEEP">
    </header>

    <form id="registerForm" novalidate>
      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
        <input id="phone" name="phone" type="tel" inputmode="numeric"
          maxlength="8" placeholder="Entrez le numéro de téléphone"
          autocomplete="tel-national" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
        <input id="password" name="password" type="password" maxlength="128"
          placeholder="Entrez le mot de passe" autocomplete="new-password" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
        <input id="confirmation" name="confirmation" type="password" maxlength="128"
          placeholder="Saisissez de nouveau le mot de passe" autocomplete="new-password" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24"><polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/></svg>
        <input id="referral" name="referral" type="text" maxlength="6"
          placeholder="Code de parrainage (facultatif)" autocomplete="off" autocapitalize="none">
      </div>

      <div id="message" class="message" role="alert" aria-live="polite"></div>
      <button id="submitButton" type="submit">S'inscrire</button>
    </form>

    <div class="bottom">
      <a href="/connexion">Aller à la connexion &gt;</a>
    </div>
  </main>

  <script>
    const AUTH_URL =
      "https://yojqocfsgnepftsxkgvq.supabase.co/functions/v1/jeep-auth";

    const form = document.getElementById("registerForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    // Remplit automatiquement le code de parrainage depuis le lien d'invitation
    // (ex. inscription.html?ref=2a77b5). Le champ reste modifiable.
    (function prefillReferral() {
      const params = new URLSearchParams(window.location.search);
      const names = ["ref", "code", "invite", "invitation", "referral", "parrain"];
      for (const name of names) {
        const value = (params.get(name) || "").trim().toLowerCase();
        if (/^[a-z0-9]{6}$/.test(value)) {
          document.getElementById("referral").value = value;
          break;
        }
      }
    })();

    function showError(text) {
      message.textContent = text;
      message.className = "message error";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmation").value;
      const referral = document.getElementById("referral").value.trim().toLowerCase();

      if (!/^[0-9]{8}$/.test(phone)) {
        showError("Le numéro doit contenir exactement 8 chiffres.");
        return;
      }
      if (password.length < 8 || password.length > 128) {
        showError("Le mot de passe doit contenir entre 8 et 128 caractères.");
        return;
      }
      if (password !== confirmation) {
        showError("Les deux mots de passe ne correspondent pas.");
        return;
      }
      if (referral && !/^[a-z0-9]{6}$/.test(referral)) {
        showError("Le code de parrainage doit contenir 6 lettres minuscules ou chiffres.");
        return;
      }

      button.disabled = true;

      try {
        const response = await fetch(AUTH_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "register",
            phone,
            password,
            password_confirmation: confirmation,
            referral_code: referral
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.error || "Impossible de créer le compte.");
        }

        sessionStorage.setItem("jeep_new_account", JSON.stringify(result.user));

        // Redirection automatique, sans message de succès
        window.location.href = "/dashboard";
        return;

      } catch (error) {
        showError(error.message || "Erreur réseau. Vérifiez votre connexion puis réessayez.");
      }
      button.disabled = false;
    });
  </script>
</body>
  </html>
